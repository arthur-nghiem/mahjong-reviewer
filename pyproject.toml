[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-reviewer"
version = "1.0.0"
description = "AI-powered Riichi Mahjong game analyzer and reviewer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Arthur Nghiem", email = "arthur.nghiem@gmail.com"}
]
keywords = ["mahjong", "riichi", "game-analysis", "machine-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "dominate==2.9.1",
    "fastapi>=0.100.0",
    "jsonlines==4.0.0",
    "mahjong==1.4.0",
    "numpy==2.3.5",
    "Pillow==12.0.0",
    "python-multipart>=0.0.7",
    "torch==2.7.0",
    "uvicorn[standard]>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/arthur-nghiem/mahjong-reviewer"
Repository = "https://github.com/arthur-nghiem/mahjong-reviewer"

[project.scripts]
mahjong-reviewer = "mahjong_reviewer.__main__:main"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]